name: Cache Metals (2x daily)

on:
  schedule:
    # Candidate schedule; the workflow guard controls real cache writes.
    - cron: '*/15 13-20 * * 1-5'
    - cron: '*/15 20-23 * * 1-5'
    - cron: '*/15 0-4 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metals-cache-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch latest metals
        id: fetch_metals
        env:
          API_KEY: ${{ secrets.METALS_API_KEY }}
        run: |
          set -euo pipefail

          node -e '
          const fs = require("fs");
          const now = new Date();
          const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/New_York",
            weekday: "short",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "numeric",
            minute: "numeric",
            hour12: false
          }).formatToParts(now);

          const p = Object.fromEntries(
            parts.filter(x => x.type !== "literal").map(x => [x.type, x.value])
          );

          const mins = Number(p.hour) * 60 + Number(p.minute);
          const businessDay = p.weekday !== "Sat" && p.weekday !== "Sun";
          const windows = [
            { name: "09:45 ET", key: "0945", start: 9 * 60 + 45, end: 16 * 60 + 30 },
            { name: "16:35 ET", key: "1635", start: 16 * 60 + 31, end: 23 * 60 + 30 }
          ];
          const slot = windows.find(w => mins >= w.start && mins <= w.end);

          if (!businessDay || !slot) {
            console.log(`Skipping metals cache candidate. ET ${p.weekday} ${p.hour}:${String(p.minute).padStart(2, "0")}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
            fs.writeFileSync(".skip-metals-cache", "1");
            process.exit(0);
          }

          const cacheSlotKey = `${p.year}-${p.month}-${p.day}-${slot.key}`;

          try {
            const prev = JSON.parse(fs.readFileSync("metals.json", "utf8"));
            if (prev?.cacheSlotKey === cacheSlotKey) {
              console.log(`Skipping duplicate metals cache slot ${cacheSlotKey}.`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
              fs.writeFileSync(".skip-metals-cache", "1");
              process.exit(0);
            }
          } catch {}

          fs.writeFileSync(".metals-slot.json", JSON.stringify({
            cacheSlotKey,
            marketWindowET: slot.name
          }, null, 2));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=false\n");
          console.log(`Proceeding with metals cache slot ${cacheSlotKey}.`);
          '

          if [ -f .skip-metals-cache ]; then
            rm .skip-metals-cache
            exit 0
          fi

          curl -fSsL --retry 3 --retry-delay 5 --max-time 60 \
            "https://api.metals.dev/v1/latest?api_key=${API_KEY}&currency=USD" \
            > metals-raw.json

          node -e '
          const fs = require("fs");
          const raw = JSON.parse(fs.readFileSync("metals-raw.json", "utf8"));
          if (!raw || !raw.metals) throw new Error("No metals field in API response");

          const slotMeta = JSON.parse(fs.readFileSync(".metals-slot.json", "utf8"));
          const m = raw.metals;
          const unitMap = {
            toz: { gPerUnit: 31.1035, label: "USD/oz t" },
            mt:  { gPerUnit: 1000000, label: "USD/ton" }
          };
          const pick = {
            gold: m.gold,
            silver: m.silver,
            platinum: m.platinum,
            palladium: m.palladium,
            copper: m.copper,
            aluminum: m.aluminum,
            nickel: m.nickel,
            lead: m.lead,
            zinc: m.zinc
          };
          const metaMap = {
            gold: { s: "Au", n: "Gold", u: "toz" },
            silver: { s: "Ag", n: "Silver", u: "toz" },
            platinum: { s: "Pt", n: "Platinum", u: "toz" },
            palladium: { s: "Pd", n: "Palladium", u: "toz" },
            copper: { s: "Cu", n: "Copper", u: "mt" },
            aluminum: { s: "Al", n: "Aluminum", u: "mt" },
            nickel: { s: "Ni", n: "Nickel", u: "mt" },
            lead: { s: "Pb", n: "Lead", u: "mt" },
            zinc: { s: "Zn", n: "Zinc", u: "mt" }
          };

          const cacheUpdatedAt = new Date().toISOString();
          const marketUpdatedAt = raw?.timestamps?.metal || raw?.timestamp || raw?.date || null;
          const out = {
            updatedAt: cacheUpdatedAt,
            cacheUpdatedAt,
            marketUpdatedAt,
            cacheSlotKey: slotMeta.cacheSlotKey,
            marketWindowET: slotMeta.marketWindowET,
            source: "metals.dev",
            items: []
          };

          for (const code of Object.keys(pick)) {
            const price = pick[code];
            if (price == null) continue;
            const meta = metaMap[code];
            const unit = unitMap[meta.u];
            const usdPerGram = price / unit.gPerUnit;
            out.items.push({
              code,
              symbol: meta.s,
              name: meta.n,
              unit: unit.label,
              nativePrice: price,
              usdPerGram: +usdPerGram.toFixed(6)
            });
          }

          if (!out.items.length) throw new Error("No metal prices computed");
          out.items.sort((a, b) => b.usdPerGram - a.usdPerGram);
          fs.writeFileSync("metals.json", JSON.stringify(out, null, 2));
          '

      - name: Commit & push
        if: steps.fetch_metals.outputs.skip != 'true'
        run: |
          git config user.name "admatera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metals-raw.json metals.json
          git commit -m "update cache $(date -u +'%F %T UTC')" || echo "no changes"
          git push
