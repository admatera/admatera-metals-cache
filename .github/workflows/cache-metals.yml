name: Cache Metals (2x daily)

on:
  schedule:
    # Candidate schedule; the Node guard controls real cache writes.
    - cron: '*/15 13-20 * * 1-5'
    - cron: '*/15 20-23 * * 1-5'
    - cron: '*/15 0-4 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metals-cache-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch latest metals
        id: fetch_metals
        env:
          API_KEY: ${{ secrets.METALS_API_KEY }}
        run: node scripts/cache-metals.cjs

      - name: Commit & push
        if: steps.fetch_metals.outputs.skip != 'true'
        env:
          FETCH_SUCCESS: ${{ steps.fetch_metals.outputs.fetch_success }}
        run: |
          set -euo pipefail
          git config user.name "admatera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metals-status.json metals-raw.json metals.json
          if [ "$FETCH_SUCCESS" = "true" ]; then
            git commit -m "update cache $(date -u +'%F %T UTC')" || echo "no changes"
          else
            git commit -m "update metals status $(date -u +'%F %T UTC')" || echo "no changes"
          fi
          git push

      - name: Fail workflow if fetch never succeeded
        if: steps.fetch_metals.outputs.skip != 'true' && steps.fetch_metals.outputs.fetch_success != 'true'
        run: |
          echo "Metals fetch failed after bounded retries. metals-status.json was updated for diagnosis."
          exit 1
